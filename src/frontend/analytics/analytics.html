<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics</title>
  <link rel="stylesheet" href="/assets/base.css" />
  <link rel="stylesheet" href="/assets/analytics/analytics.css" />
</head>
<body class="an-body">
  <main class="an-page">
    <header class="an-header">
      <a class="an-back" href="/#control-panel" aria-label="Back to Control Panel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Control Panel
      </a>
      <div class="an-title-row">
        <h1 class="an-title">Analytics</h1>
        <div class="an-range" role="group" aria-label="Time range">
          <button type="button" data-days="7">7 days</button>
          <button type="button" data-days="30">30 days</button>
          <button type="button" data-days="90">90 days</button>
          <button type="button" data-days="365">1 year</button>
        </div>
      </div>
      <p id="an-status" class="an-status" role="status"></p>
    </header>

    <section id="an-kpis" class="an-kpis" aria-label="Totals"></section>

    <h2 class="an-section-title">Chats</h2>
    <div class="an-grid">
      <section class="an-card an-wide" aria-labelledby="an-daily-title">
        <h3 id="an-daily-title" class="an-card-title">Questions per day</h3>
        <div id="an-daily" class="an-chart"></div>
      </section>
      <section class="an-card" aria-labelledby="an-models-title">
        <h3 id="an-models-title" class="an-card-title">Replies by model</h3>
        <div id="an-models"></div>
      </section>
      <section class="an-card" aria-labelledby="an-tools-title">
        <h3 id="an-tools-title" class="an-card-title">Tool actions by outcome</h3>
        <div id="an-tools"></div>
      </section>
    </div>

    <h2 class="an-section-title">Work done for you</h2>
    <div class="an-grid">
      <section class="an-card" aria-labelledby="an-tasks-title">
        <h3 id="an-tasks-title" class="an-card-title">To Do from email</h3>
        <div id="an-tasks"></div>
      </section>
      <section class="an-card" aria-labelledby="an-calls-title">
        <h3 id="an-calls-title" class="an-card-title">Phone calls</h3>
        <div id="an-calls"></div>
      </section>
      <section class="an-card" aria-labelledby="an-alarms-title">
        <h3 id="an-alarms-title" class="an-card-title">Alarms</h3>
        <div id="an-alarms"></div>
      </section>
    </div>

    <h2 class="an-section-title">Search quality</h2>
    <div class="an-grid">
      <section class="an-card" aria-labelledby="an-coverage-title">
        <h3 id="an-coverage-title" class="an-card-title">Meaning search coverage</h3>
        <div id="an-coverage"></div>
      </section>
      <section class="an-card an-wide" aria-labelledby="an-scores-title">
        <h3 id="an-scores-title" class="an-card-title">Latest evaluation</h3>
        <div id="an-scores"></div>
      </section>
      <section class="an-card an-wide" aria-labelledby="an-sweep-title">
        <h3 id="an-sweep-title" class="an-card-title">Similarity cutoff</h3>
        <div id="an-sweep" class="an-chart"></div>
      </section>
      <section class="an-card an-wide" aria-labelledby="an-history-title">
        <h3 id="an-history-title" class="an-card-title">Evaluation runs</h3>
        <div id="an-history" class="an-chart"></div>
      </section>
    </div>
  </main>
  <div id="an-tooltip" class="an-tooltip" role="tooltip" hidden></div>
  <script type="module" src="/assets/analytics/analytics.js"></script>
</body>
</html>
