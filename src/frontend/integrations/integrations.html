<div id="integrations-menu" class="context-menu integrations-menu" hidden>
  <input id="add-files-input" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,.pdf" multiple hidden />
  <button id="add-files-button" class="context-menu-item add-files-button" type="button">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6.5V16a4 4 0 0 1-8 0V6a2.5 2.5 0 0 1 5 0v9.5a1 1 0 0 1-2 0V7"/></svg>
    <span>Add photos &amp; files</span>
    <span class="add-files-hint">Upload from computer</span>
  </button>
  <div class="integrations-menu-title">Integrations</div>
  <div id="integrations-list" class="integrations-list"></div>
  <p id="integrations-message" class="integrations-message" hidden></p>
  <button id="add-integration-button" class="context-menu-item" type="button">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Add integration</span>
  </button>
  <button id="add-api-button" class="context-menu-item" type="button">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/></svg>
    <span>Add API</span>
  </button>
</div>

<dialog id="integration-dialog" class="integration-dialog">
  <form id="integration-form" class="integration-form">
    <h2 id="integration-form-title">Add integration</h2>
    <input type="hidden" name="kind" value="mcp" />

    <label class="field">
      <span>Name</span>
      <input name="name" type="text" maxlength="60" required />
    </label>

    <div data-section="mcp">
      <label class="field">
        <span>Server URL</span>
        <input name="mcpUrl" type="url" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Username</span>
          <input name="username" type="text" autocomplete="off" />
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="new-password" />
        </label>
      </div>
    </div>

    <div data-section="api">
      <label class="field">
        <span>What it does</span>
        <textarea name="description" rows="2"></textarea>
        <small>The model reads this to decide when to use it.</small>
      </label>
      <div class="field-row">
        <label class="field method-field">
          <span>Method</span>
          <select name="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
          </select>
        </label>
        <label class="field">
          <span>URL</span>
          <input name="apiUrl" type="text" />
        </label>
      </div>
      <label class="field">
        <span>Parameters</span>
        <textarea name="parameters" rows="3" spellcheck="false"></textarea>
        <small>One per line as name: description. Start with * if required. Use {name} in the URL to put a value in the path.</small>
      </label>
      <label class="field">
        <span>API key</span>
        <input name="apiKey" type="password" autocomplete="off" />
        <small>Leave blank if this API doesn't need one.</small>
      </label>
      <div class="field-row">
        <label class="field">
          <span>Header name</span>
          <input name="authHeader" type="text" value="Authorization" />
        </label>
        <label class="field">
          <span>Key prefix</span>
          <input name="authPrefix" type="text" value="Bearer " />
        </label>
      </div>
    </div>

    <small class="integration-secrets-note">Logins are saved to your system keychain, never to the database or .env.</small>

    <p id="integration-form-error" class="form-error" hidden></p>

    <div class="dialog-actions">
      <button id="integration-cancel-button" class="secondary-button" type="button">Cancel</button>
      <button id="integration-save-button" class="save-button" type="submit">Add</button>
    </div>
  </form>
</dialog>

<dialog id="gmail-dialog" class="integration-dialog">
  <form id="gmail-form" class="integration-form">
    <h2>Add integration</h2>

    <label class="field">
      <span>Gmail address</span>
      <input name="address" type="email" autocomplete="email" required />
    </label>
    <label class="field">
      <span>App password</span>
      <input name="appPassword" type="password" autocomplete="new-password" required />
      <small>Don't have one? <a class="gmail-password-link" href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener noreferrer">Get it from Google</a>. If Google says it's unavailable, turn on 2-Step Verification first.</small>
    </label>

    <p id="gmail-form-error" class="form-error" hidden></p>

    <div class="dialog-actions">
      <button id="gmail-cancel-button" class="secondary-button" type="button">Cancel</button>
      <button id="gmail-connect-button" class="save-button" type="submit">Connect</button>
    </div>
  </form>
</dialog>
