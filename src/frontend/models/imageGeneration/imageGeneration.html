<div id="image-attachment" class="image-attachment" hidden>
  <input id="image-file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
  <button id="attach-image-button" class="add-button" type="button" title="Attach images to edit">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L6 20"/></svg>
  </button>
</div>

<div id="image-preview" class="image-preview" hidden></div>

<div id="image-drop-overlay" class="image-drop-overlay" hidden>
  <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L6 20"/></svg>
  <strong>Add images</strong>
  <span>Drop up to 20 images here to add them to the conversation</span>
</div>
