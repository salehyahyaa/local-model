<section id="notes-view" class="notes-view" aria-label="Notes" hidden>
  <div class="notes-scroll">
    <label class="note-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="notes-search-input" class="note-search-input" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off" />
    </label>
    <div class="notes-actions">
      <button id="notes-bullet-button" class="notes-tool-button notes-glyph-button" type="button" title="Copy a bullet (•)" aria-label="Copy a bullet">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="5"/></svg>
      </button>
      <button id="notes-dash-button" class="notes-tool-button notes-glyph-button" type="button" title="Copy a dash (–)" aria-label="Copy a dash">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
      </button>
      <span id="notes-copied" class="notes-copied" role="status"></span>
    </div>
    <p id="notes-status" class="notes-status" role="status" hidden></p>
    <div class="notes-area">
      <div class="notes-plus-slot">
        <button id="notes-plus-button" class="notes-tool-button" type="button" title="New note" aria-label="New note">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div id="notes-board" class="notes-board"></div>
    </div>
  </div>
</section>
