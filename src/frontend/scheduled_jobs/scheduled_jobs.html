<section id="scheduled-view" class="scheduled-view" aria-label="Scheduled" hidden>
  <div class="scheduled-scroll">
    <header class="scheduled-header">
      <button id="scheduled-filter" class="scheduled-filter" type="button" aria-label="Show active or all tasks">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5Z"/></svg>
        <span id="scheduled-filter-label">Active</span>
      </button>
    </header>

    <form id="scheduled-composer" class="scheduled-composer" autocomplete="off">
      <div id="scheduled-files" class="scheduled-files" hidden></div>
      <div class="scheduled-composer-row">
        <label class="scheduled-add" title="Add photos" aria-label="Add photos">
          <input id="scheduled-file-input" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" multiple hidden />
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </label>
        <textarea id="scheduled-input" class="scheduled-input" rows="1" placeholder="Schedule a task" aria-label="Schedule a task"></textarea>
        <button id="scheduled-send" class="scheduled-send" type="submit" aria-label="Schedule" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </form>

    <p id="scheduled-status" class="scheduled-status" role="status" hidden></p>
    <ul id="scheduled-tasks-list" class="scheduled-tasks"></ul>
    <p id="scheduled-tasks-empty" class="scheduled-empty" hidden></p>

    <details class="scheduled-workers">
      <summary>Background workers <span id="scheduled-workers-count" class="scheduled-count"></span></summary>
      <ul id="scheduled-list" class="scheduled-list"></ul>
    </details>
  </div>
</section>
